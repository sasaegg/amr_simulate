name: amr_sim

services:
  sim:
    image: amr-sim:humble
    command: ["sleep", "infinity"]
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

    network_mode: host
    ipc: host
    # tini 當 PID 1：轉發訊號、回收子程序（PID 1 預設忽略 SIGTERM）
    init: true
    env_file: ./config/ros.env
    environment:
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      AMR_WORLDS_DIR: /ros_ws/src/amr_worlds   # launch 從原始碼讀 world／場景，改 YAML 不用重新 build
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro    # X11 socket：視窗畫到主機桌面
      - ../../ros_ws:/ros_ws                 # 原始碼：改了不用重建映像
      - ./config:/config                     # 執行設定：可寫

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
