# 小型倉庫範例場景：20 x 15 m
# 座標原點在左下角，x 往右、y 往上，單位公尺；四面外牆自動產生
#
#  15 ┌───────────────────────┬────────────────┐
#     │                       │                │
#     │  ▭▭▭  ▭▭▭  ▭▭▭        │      ●  │   ▭ 貨架（兩排）
#  11 │                       │                │   ■ box 障礙物
#     │                       │   ─────────────│ 9 ● 圓柱障礙物
#   8 │  ▭▭▭  ▭▭▭  ▭▭▭        │           │   ▲ 出生點
#     │                       │                │
#   6 │                             ◇          │   ◇ 旋轉 box
#   4 │          ■                             │
#   2 │                              ●         │
#     │ ▲                                      │
#   0 └────────────────────────────────────────┘
#     0         5        10   12  15          20
name: warehouse_small
size: [20, 15]

walls:
  - {from: [12, 6], to: [12, 15]}    # 隔間牆，南側 0–6 m 留出通道
  - {from: [15, 9], to: [20, 9]}     # 東側房間的短牆，讓地圖不對稱、利於 SLAM 定位

shelves:
  # 第一排（y = 8），排與排之間走道 2.4 m
  - {pos: [3, 8], yaw: 0, size: [2.0, 0.6, 1.8]}
  - {pos: [6, 8], yaw: 0, size: [2.0, 0.6, 1.8]}
  - {pos: [9, 8], yaw: 0, size: [2.0, 0.6, 1.8]}
  # 第二排（y = 11）
  - {pos: [3, 11], yaw: 0, size: [2.0, 0.6, 1.8]}
  - {pos: [6, 11], yaw: 0, size: [2.0, 0.6, 1.8]}
  - {pos: [9, 11], yaw: 0, size: [2.0, 0.6, 1.8]}

obstacles:
  - {type: box, pos: [7, 4], size: [1.0, 1.0, 1.0]}
  - {type: box, pos: [15, 6], yaw: 0.5, size: [1.2, 0.8, 1.0]}
  - {type: cylinder, pos: [17, 12], radius: 0.3, height: 1.2}
  - {type: cylinder, pos: [14, 2], radius: 0.25, height: 1.0}

spawn:
  amr1: [1, 1, 0]
